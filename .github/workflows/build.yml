name: Build Executables

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      
      - name: Build Fat JAR
        run: ./gradlew shadowJar
      
      - name: Create Windows Executable with jpackage
        run: |
          jpackage --input build/libs --main-jar YouAreTheMonster-1.0.0.jar --name "YouAreTheMonster" --type app-image --dest build/executables --java-options "-Xmx512m"
      
      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/executables/
          
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      
      - name: Build Fat JAR
        run: ./gradlew shadowJar
      
      - name: Create macOS App with jpackage
        run: |
          jpackage --input build/libs --main-jar YouAreTheMonster-1.0.0.jar --name "YouAreTheMonster" --type app-image --dest build/executables --java-options "-Xmx512m"
      
      - name: Upload macOS Build
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: build/executables/
          
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      
      - name: Build Fat JAR
        run: ./gradlew shadowJar
      
      - name: Create Linux App with jpackage
        run: |
          jpackage --input build/libs --main-jar YouAreTheMonster-1.0.0.jar --name "YouAreTheMonster" --type app-image --dest build/executables --java-options "-Xmx512m"
      
      - name: Upload Linux Build
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: build/executables/
          
  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Download all builds
        uses: actions/download-artifact@v4
        
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: Release ${{ github.run_number }}
          files: |
            windows-build/*
            macos-build/*
            linux-build/*
          generate_release_notes: true
