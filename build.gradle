plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'com.ludumdare33'
version = '1.0.0'
description = 'You Are The Monster - Ludum Dare 33'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
    maven { url 'https://plugins.gradle.org/m2/' }
}

// JavaFX version
def javafxVersion = '17.0.2'
def javafxPlatform = getJavafxPlatform()

dependencies {
    implementation "org.openjfx:javafx-controls:${javafxVersion}:${javafxPlatform}"
    implementation "org.openjfx:javafx-fxml:${javafxVersion}:${javafxPlatform}"
    implementation "org.openjfx:javafx-graphics:${javafxVersion}:${javafxPlatform}"
    implementation 'org.json:json:20231013'
}

def getJavafxPlatform() {
    def os = System.getProperty('os.name', '').toLowerCase()
    def arch = System.getProperty('os.arch', '').toLowerCase()
    if (os.contains('win')) return 'win'
    if (os.contains('mac') || os.contains('darwin')) return 'mac'
    if (os.contains('linux')) return 'linux'
    return 'linux'
}

application {
    mainClass = 'Game'
}

shadowJar {
    archiveBaseName.set('YouAreTheMonster')
    archiveClassifier.set('')
    archiveVersion.set('1.0.0')
    
    manifest {
        attributes 'Main-Class': 'Game'
    }
    
    mergeServiceFiles()
}

jar {
    manifest {
        attributes(
            'Main-Class': 'Game',
            'Implementation-Title': 'You Are The Monster',
            'Implementation-Version': version
        )
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}
